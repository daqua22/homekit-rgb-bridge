name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_preview:
        description: Retained for compatibility; CI always uploads verified Windows artifacts
        required: false
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run smoke
      - run: npm run licenses
      - run: git diff --exit-code -- THIRD_PARTY_NOTICES.md docs/dependency-licenses.md
      - run: npm audit --omit=dev
      - run: npm run package:preview
      - run: npm run package:verify
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npx playwright install --with-deps chromium
      - if: matrix.os == 'windows-latest' && matrix.node == 24
        run: npx playwright install chromium
      - if: matrix.node == 24
        run: npm run test:browser
      - if: matrix.os == 'windows-latest' && matrix.node == 24
        run: npm run package:windows
      - if: matrix.os == 'windows-latest' && matrix.node == 24
        run: npm run verify:windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'windows-latest' && matrix.node == 24
        with:
          name: windows-x64-experimental-review
          path: |
            artifacts/*windows-x64-portable.zip
            artifacts/SHA256SUMS-windows-x64.txt
          retention-days: 14
          if-no-files-found: error
