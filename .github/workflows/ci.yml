name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_preview:
        description: Upload verified Node preview archive as a CI artifact (no release)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run smoke
      - run: npm run licenses
      - run: git diff --exit-code -- THIRD_PARTY_NOTICES.md docs/dependency-licenses.md
      - run: npm audit --omit=dev
      - run: npm run package:preview
      - run: npm run package:verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.upload_preview && matrix.os == 'windows-latest' && matrix.node == 24
        with:
          name: windows-node-experimental-preview
          path: artifacts/*
          retention-days: 14
          if-no-files-found: error
