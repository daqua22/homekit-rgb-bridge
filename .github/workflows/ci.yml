name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_preview:
        description: Upload verified Node preview archive as a CI artifact (no release)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run smoke
      - run: npm run licenses
      - run: git diff --exit-code -- THIRD_PARTY_NOTICES.md docs/dependency-licenses.md
      - run: npm audit --omit=dev
      - run: npm run package:preview
      - run: npm run package:verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.upload_preview && matrix.os == 'windows-latest' && matrix.node == 24
        with:
          name: windows-node-experimental-preview
          path: artifacts/*
          retention-days: 14
          if-no-files-found: error
